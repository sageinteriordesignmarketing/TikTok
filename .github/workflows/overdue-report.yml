name: Daily overdue report

on:
  # The weekday 8 AM Eastern run is started by a Claude scheduled routine
  # that presses "Run workflow" with preview off. GitHub's own cron timer was
  # dropped/delayed by hours, so it is not used.

  # Lets you run it by hand from the Actions tab ("Run workflow" button).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (show the report in the log, don't post to Slack)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: overdue-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and send the report
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python overdue_report.py --dry-run
          else
            python overdue_report.py
          fi
